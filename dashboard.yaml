title: Marstek · Energy Studio
views:
- title: Energiezentrale
  path: marstek
  icon: mdi:solar-power-variant
  type: sections
  max_columns: 2
  dense_section_placement: false
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:mushroom-title-card
      title: Marstek · Energy Studio
      subtitle: Live-Übersicht deiner PV-Anlage und beider Speicher
      grid_options:
        columns: full
    - type: custom:mushroom-chips-card
      alignment: start
      grid_options:
        columns: full
      chips:
      - type: template
        icon: mdi:transmission-tower-import
        icon_color: '{{ ''amber'' if is_state(''switch.marstek_pv_manager_notfall_netzladung'',''on'')
          else ''grey'' }}'
        content: '{{ ''Notfall EIN'' if is_state(''switch.marstek_pv_manager_notfall_netzladung'',''on'')
          else ''Notfall AUS'' }}'
        tap_action:
          action: more-info
          entity: switch.marstek_pv_manager_notfall_netzladung
      - type: template
        icon: '{% set m = states(''sensor.marstek_pv_manager_betriebsmodus'') %} {{ ''mdi:battery-arrow-up''
          if m == ''charge'' else ''mdi:battery-arrow-down'' if m == ''discharge'' else ''mdi:weather-night''
          if m == ''night'' else ''mdi:pause-circle'' if m in [''idle'',''disabled''] else ''mdi:alert-circle''
          }}'
        icon_color: '{% set m = states(''sensor.marstek_pv_manager_betriebsmodus'') %} {{ ''amber'' if
          m in [''emergency_charge'',''emergency_hold''] else ''red'' if m == ''emergency_blocked'' else
          ''green'' if m == ''charge'' else ''blue'' if m == ''discharge'' else ''purple'' if m == ''night''
          else ''grey'' if m in [''idle'',''disabled''] else ''red'' }}'
        content: '{% set m = states(''sensor.marstek_pv_manager_betriebsmodus'') %} {{ {''emergency_charge'':''Netzladung'',''emergency_hold'':''Reserve
          hält'',''emergency_blocked'':''Netzladung gesperrt'',''charge'':''PV-Ladung'',''discharge'':''Entladung'',''idle'':''Bereit'',''night'':''Nachtladung'',''disabled'':''Regelung
          AUS'',''unavailable'':''Störung''}.get(m,''Unbekannt'') }}'
        tap_action:
          action: more-info
          entity: sensor.marstek_pv_manager_betriebsmodus
      - type: template
        icon: mdi:battery-heart-variant
        icon_color: green
        content: Marstek {{ states('sensor.marstek_venus_modbus_soc_batterie') }} %
        tap_action:
          action: more-info
          entity: sensor.marstek_venus_modbus_soc_batterie
      - type: template
        icon: mdi:battery-high
        icon_color: blue
        content: SolaX {{ states('sensor.solax_m_battery_capacity_2') }} %
        tap_action:
          action: more-info
          entity: sensor.solax_m_battery_capacity_2
      - type: template
        icon: mdi:weather-night
        icon_color: '{{ ''purple'' if is_state(''input_boolean.marstek_10_soc_nachtladung'',''on'') else
          ''grey'' }}'
        content: '{{ ''Nachtladung aktiv'' if is_state(''input_boolean.marstek_10_soc_nachtladung'',''on'')
          else ''Nachtladung aus'' }}'
        tap_action:
          action: more-info
          entity: input_boolean.marstek_10_soc_nachtladung
    - type: custom:mushroom-template-card
      grid_options:
        columns: 12
      entity: sensor.marstek_pv_manager_regelstatus
      primary: '{% set mode = states(''sensor.marstek_pv_manager_betriebsmodus'') %} {{ {''emergency_charge'':''Notfall-Netzladung
        aktiv'',''emergency_hold'':''Notfall-Reserve wird gehalten'',''emergency_blocked'':''Notfall-Netzladung
        gesperrt'',''charge'':''PV-Überschuss wird gespeichert'',''discharge'':''Marstek versorgt das
        Haus'',''idle'':''Regelung in Bereitschaft'',''night'':''Nachtladung hat Vorrang'',''disabled'':''Automatik
        ist ausgeschaltet'',''unavailable'':''Regelung prüfen''}.get(mode, ''Regelstatus unbekannt'')
        }}'
      secondary: '{{ states(''sensor.marstek_pv_manager_regelstatus'') }}'
      icon: '{% set m = states(''sensor.marstek_pv_manager_betriebsmodus'') %} {{ ''mdi:transmission-tower-import''
        if m == ''emergency_charge'' else ''mdi:battery-check'' if m == ''emergency_hold'' else ''mdi:solar-power''
        if m == ''charge'' else ''mdi:home-lightning-bolt-outline'' if m == ''discharge'' else ''mdi:weather-night''
        if m == ''night'' else ''mdi:power-standby'' if m == ''disabled'' else ''mdi:shield-check-outline''
        if m == ''idle'' else ''mdi:alert-circle'' }}'
      color: '{% set m = states(''sensor.marstek_pv_manager_betriebsmodus'') %} {{ ''amber'' if m in [''emergency_charge'',''emergency_hold'']
        else ''red'' if m == ''emergency_blocked'' else ''green'' if m == ''charge'' else ''blue'' if
        m == ''discharge'' else ''purple'' if m == ''night'' else ''red'' if m == ''unavailable'' else
        ''grey'' }}'
      tap_action:
        action: more-info
    - type: custom:marstek-energy-flow-card
      title: Energiefluss in Echtzeit
      grid_options:
        columns: full
        rows: auto
      entities:
        pv:
        - sensor.pv_leistung_gesamt
        grid: sensor.solax_m_measured_power
        marstek: sensor.marstek_venus_modbus_ac_leistung
        solax: sensor.solax_m_battery_power_charge
        solax_soc: sensor.solax_m_battery_capacity_2
        marstek_soc: sensor.marstek_venus_modbus_soc_batterie
  - type: grid
    cards:
    - type: heading
      heading: Steuerung & Limits
      heading_style: title
    - type: tile
      entity: switch.marstek_pv_manager_regelung_aktiv
      name: Marstek Automatik
      icon: mdi:autorenew
      grid_options:
        columns: full
      features:
      - type: toggle
    - type: custom:mushroom-number-card
      entity: number.marstek_pv_manager_maximale_ladeleistung
      name: Maximale Ladeleistung
      icon: mdi:battery-arrow-up
      icon_color: green
      display_mode: slider
      grid_options:
        columns: 12
    - type: custom:mushroom-number-card
      entity: number.marstek_pv_manager_maximale_entladeleistung
      name: Maximale Entladeleistung
      icon: mdi:battery-arrow-down
      icon_color: blue
      display_mode: slider
      grid_options:
        columns: 12
    - type: custom:mushroom-chips-card
      alignment: start
      grid_options:
        columns: full
      chips:
      - type: template
        icon: mdi:arrow-up-bold-circle
        icon_color: green
        content: Laden {{ states('sensor.marstek_pv_manager_wirksames_ladelimit') }} W effektiv
      - type: template
        icon: mdi:arrow-down-bold-circle
        icon_color: blue
        content: Entladen {{ states('sensor.marstek_pv_manager_wirksames_entladelimit') }} W effektiv
    - type: entities
      title: Aktuelle Stellwerte
      show_header_toggle: false
      entities:
      - entity: sensor.marstek_pv_manager_ladeziel
        name: Berechnetes Ladeziel
      - entity: sensor.marstek_pv_manager_entladeziel
        name: Berechnetes Entladeziel
      - entity: number.marstek_venus_modbus_ladeleistung_einstellen
        name: Aktueller Marstek-Ladesollwert
      - entity: number.marstek_venus_modbus_entladeleistung_einstellen
        name: Aktueller Marstek-Entladesollwert
    - type: heading
      heading: Mindest-SoC · Nachtladung
      heading_style: subtitle
    - type: tile
      entity: switch.marstek_pv_manager_mindest_soc_nachtladung
      name: Nachtreserve 00:00–06:00
      icon: mdi:weather-night
      features:
      - type: toggle
      grid_options:
        columns: full
    - type: custom:mushroom-template-card
      entity: sensor.marstek_pv_manager_nachtladung_status
      primary: 'Nachtladung: 10 % → 11 %'
      secondary: '{{ states(''sensor.marstek_pv_manager_nachtladung_status'') }}'
      icon: mdi:battery-clock-outline
      color: '{{ ''purple'' if is_state(''input_boolean.marstek_10_soc_nachtladung'',''on'') else ''grey''
        }}'
      grid_options:
        columns: 12
      tap_action:
        action: more-info
  - type: grid
    cards:
    - type: heading
      heading: Notfall · Netzladung
      heading_style: title
    - type: custom:mushroom-template-card
      entity: switch.marstek_pv_manager_notfall_netzladung
      primary: '{{ ''Netzladung aktiviert'' if is_state(''switch.marstek_pv_manager_notfall_netzladung'',''on'')
        else ''Notfall-Reserve aufladen'' }}'
      secondary: '{{ states(''sensor.marstek_pv_manager_notfall_status'') }}'
      icon: mdi:transmission-tower-import
      color: '{{ ''amber'' if is_state(''switch.marstek_pv_manager_notfall_netzladung'',''on'') else ''grey''
        }}'
      tap_action:
        action: more-info
      grid_options:
        columns: 12
    - type: tile
      entity: switch.marstek_pv_manager_notfall_netzladung
      name: Notfall-Netzladung aktivieren
      icon: mdi:shield-home-outline
      features:
      - type: toggle
      grid_options:
        columns: full
    - type: custom:mushroom-number-card
      entity: number.marstek_pv_manager_notfall_ladeleistung
      name: Netzladeleistung
      icon: mdi:transmission-tower-import
      icon_color: amber
      display_mode: slider
      grid_options:
        columns: 12
    - type: custom:mushroom-number-card
      entity: number.marstek_pv_manager_notfall_ziel_soc
      name: Reserve-Ladeziel (SoC)
      icon: mdi:battery-check
      icon_color: green
      display_mode: slider
      grid_options:
        columns: 12
    - type: custom:mushroom-chips-card
      alignment: start
      grid_options:
        columns: full
      chips:
      - type: template
        icon: mdi:battery
        icon_color: green
        content: Marstek {{ states('sensor.marstek_venus_modbus_soc_batterie') }} %
      - type: template
        icon: mdi:flash
        icon_color: amber
        content: Max. {{ states('sensor.marstek_pv_manager_wirksame_notfall_ladeleistung') }} W
  - type: grid
    cards:
    - type: heading
      heading: Sicherheit & Freigaben
      heading_style: title
    - type: custom:mushroom-template-card
      entity: sensor.marstek_pv_manager_entladesperre
      primary: '{{ ''Entladung freigegeben'' if is_state(''sensor.marstek_pv_manager_entladesperre'',''Freigegeben'')
        else ''Entladung aktuell gesperrt'' }}'
      secondary: '{{ states(''sensor.marstek_pv_manager_entladesperre'') }}'
      icon: '{{ ''mdi:shield-check'' if is_state(''sensor.marstek_pv_manager_entladesperre'',''Freigegeben'')
        else ''mdi:shield-lock-outline'' }}'
      color: '{{ ''green'' if is_state(''sensor.marstek_pv_manager_entladesperre'',''Freigegeben'') else
        ''amber'' }}'
      grid_options:
        columns: 12
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      entity: sensor.evcc_delta_ac_smart_wallbox_charge_power
      primary: Delta-Wallbox
      secondary: "{% if has_value('sensor.evcc_delta_ac_smart_wallbox_charge_power') %}\n  {{ states('sensor.evcc_delta_ac_smart_wallbox_charge_power')\
        \ }} kW · {{ 'Lädt' if states('sensor.evcc_delta_ac_smart_wallbox_charge_power') | float(0) >\
        \ 0.05 else 'Bereit' }}\n{% else %}Keine Messwerte{% endif %}"
      icon: mdi:ev-station
      color: '{{ ''amber'' if states(''sensor.evcc_delta_ac_smart_wallbox_charge_power'') | float(0) >
        0.05 else ''grey'' }}'
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: binary_sensor.evcc_necharge_charging
      primary: NeCharge
      secondary: '{% set active = is_state(''binary_sensor.evcc_necharge_charging'',''on'') or states(''sensor.necharge_ladeleistung'')
        | float(0) > 50 %} {{ ''Lädt · '' if active else ''Bereit · '' }}{{ states(''sensor.necharge_ladeleistung'')
        }} W'
      icon: mdi:car-electric
      color: '{{ ''amber'' if is_state(''binary_sensor.evcc_necharge_charging'',''on'') or states(''sensor.necharge_ladeleistung'')
        | float(0) > 50 else ''grey'' }}'
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: switch.puffer_shellypro3_output_1
      primary: Pufferspeicher-Heizung
      secondary: '{% set on = (1 if is_state(''switch.puffer_shellypro3_output_1'',''on'') else 0) + (1
        if is_state(''switch.puffer_shellypro3_output_2'',''on'') else 0) + (1 if is_state(''switch.puffer_shellypro3_output_3'',''on'')
        else 0) %} {{ on }} von 3 Heizkanälen aktiv'
      icon: mdi:water-boiler
      color: '{{ ''amber'' if is_state(''switch.puffer_shellypro3_output_1'',''on'') or is_state(''switch.puffer_shellypro3_output_2'',''on'')
        or is_state(''switch.puffer_shellypro3_output_3'',''on'') else ''grey'' }}'
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: switch.warmwasser_shellypro3_output_1
      primary: Warmwasser-Heizung
      secondary: '{% set on = (1 if is_state(''switch.warmwasser_shellypro3_output_1'',''on'') else 0)
        + (1 if is_state(''switch.warmwasser_shellypro3_output_2'',''on'') else 0) + (1 if is_state(''switch.warmwasser_shellypro3_output_3'',''on'')
        else 0) %} {{ on }} von 3 Heizkanälen aktiv'
      icon: mdi:water-thermometer
      color: '{{ ''amber'' if is_state(''switch.warmwasser_shellypro3_output_1'',''on'') or is_state(''switch.warmwasser_shellypro3_output_2'',''on'')
        or is_state(''switch.warmwasser_shellypro3_output_3'',''on'') else ''grey'' }}'
      grid_options:
        columns: 6
    - type: entities
      title: Details der Sperren
      show_header_toggle: false
      entities:
      - entity: input_boolean.marstek_10_soc_nachtladung
        name: 10-%-Nachtladung (Vorrang)
      - entity: switch.puffer_shellypro3_output_1
        name: Puffer · Kanal 1
      - entity: switch.puffer_shellypro3_output_2
        name: Puffer · Kanal 2
      - entity: switch.puffer_shellypro3_output_3
        name: Puffer · Kanal 3
      - entity: switch.warmwasser_shellypro3_output_1
        name: Warmwasser · Kanal 1
      - entity: switch.warmwasser_shellypro3_output_2
        name: Warmwasser · Kanal 2
      - entity: switch.warmwasser_shellypro3_output_3
        name: Warmwasser · Kanal 3
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Leistung · letzte 3 Stunden
      heading_style: title
    - type: history-graph
      grid_options:
        columns: full
        rows: auto
      title: PV / Marstek / Netz / SolaX
      hours_to_show: 3
      entities:
      - entity: sensor.pv_leistung_gesamt
        name: PV gesamt (ohne neue 3 BKW)
      - entity: sensor.marstek_venus_modbus_ac_leistung
        name: Marstek AC (+ Entladen)
      - entity: sensor.solax_m_measured_power
        name: Netz (+ Einspeisung)
      - entity: sensor.solax_m_battery_power_charge
        name: SolaX Akku (+ Laden)
    - type: markdown
      grid_options:
        columns: full
      content: '**Vorzeichen:** Netz **+ = Einspeisung**, **− = Bezug** · Marstek **+ = Entladung**, **−
        = Ladung** · SolaX **+ = Ladung**, **− = Entladung**. Die zentrale Hausleistung im Energiefluss
        ist ein **Schätzwert** aus PV + Marstek − SolaX-Akkuladung − Netzeinspeisung. Verluste und nicht
        erfasste Erzeuger/Verbraucher sind nicht berücksichtigt.'
