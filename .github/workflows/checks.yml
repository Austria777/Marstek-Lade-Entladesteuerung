name: Static checks

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile integration
        run: python -m compileall -q custom_components

  javascript-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check custom card syntax
        run: node --check www/marstek-energy-flow-card.js
      - name: Test EV energy-flow frontend
        run: node --test tests/test_energy_flow_card.cjs
